# updated profiles with base and other 
base-profiles:
  base-standard:
    display_name: "Intel Edge Base Profile"
    description: "Graphics and media software with AI compute support."
    supported_platforms:
      - "ptl"
      - "wcl"
    supported_os_variants:
      - "ubuntu_noble"
      - "ubuntu_resolute"
    meta_packages: 
      - intel-edge-base-standard
    prerequisites:
      ubuntu_noble:
        repositories:
          - repository_url: "https://snapshot.ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu/20260830T100000Z"
            repository_dist: "noble"
            repository_components:
              - "main"
            repository_key: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0c0e6af955ce463c03fc51574d098d70afbe5e1f"
      ubuntu_resolute:
        repositories:
          - repository_url: "https://snapshot.ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu/20260830T100000Z"
            repository_dist: "resolute"
            repository_components:
              - "main"
            repository_key: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0c0e6af955ce463c03fc51574d098d70afbe5e1f"
      
  base-realtime:
    display_name: "Intel Edge Realtime Profile"
    description: "Intel Edge Realtime Profile with Intel Realtime Kernel"
    supported_platforms:
      - "ptl"
      - "wcl"
    supported_os_variants:
      - "ubuntu_resolute"
    meta_packages: 
      - intel-edge-base-realtime
    prerequisites:
      ubuntu_resolute:
        repositories:
          - repository_url: "https://snapshot.ppa.launchpadcontent.net/kobuk-team/intel-graphics/ubuntu/20260830T100000Z"
            repository_dist: "resolute"
            repository_components:
              - "main"
            repository_key: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0c0e6af955ce463c03fc51574d098d70afbe5e1f"

profiles:

  ffmpeg:
    display_name: "FFmpeg"
    description: "FFmpeg multimedia framework with Intel GPU support."
    category: "Application/Tools"
    base-profiles: # only available for these profile
      - base-standard
      - base-realtime
    supported_platforms:
      - "ptl"
      - "wcl"
    meta_packages: # additional package to install on top of base profiles
      - intel-edge-media-ffmpeg

  gstreamer:
    display_name: "GStreamer"
    description: "GStreamer multimedia framework with Intel GPU support."
    category: "Application/Tools"
    base-profiles: # only available for these profile
      - base-standard
      - base-realtime
    supported_platforms:
      - "ptl"
      - "wcl"
    meta_packages: # additional package to install on top of base profiles
      - intel-edge-media-gst

  manageability:
    display_name: "Manageability"
    description: "Software to enable Intel vPro manageability on Edge platforms."
    category: "Intel Technologies"
    base-profiles: # only available for these profile
      - base-standard
      - base-realtime
    supported_platforms:
      - "ptl"
      - "wcl"
    meta_packages: # additional package to install on top of base profiles
      - intel-edge-manageability

  ipu:
    display_name: "IPU"
    description: "Group of software components and ingredients to enable Intel's Image Processing Unit (IPU) technology on Edge platforms."
    category: "Intel Technologies"
    base-profiles: # only available for these profile
      - base-standard
      - base-realtime
    supported_platforms:
      - "ptl"
    meta_packages: # additional package to install on top of base profiles
      - intel-edge-ipu
    # Preseeds for the selected GMSL driver, IPU generation, board, and sensor.
    debconf_selections:
      - package: intel-mipi-gmsl-dkms
        question: intel-mipi-gmsl-dkms/max9x
        type: select
        value: maxim-serdes
      - package: intel-mipi-gmsl-dkms
        question: intel-mipi-gmsl-dkms/ipu
        type: select
        value: ipu7
      - package: intel-mipi-gmsl-dkms
        question: intel-mipi-gmsl-dkms/board
        type: select
        value: max96724-cexd-intrbl
      - package: intel-mipi-gmsl-dkms
        question: intel-mipi-gmsl-dkms/sensor
        type: select
        value: d3_isx031

  tsn:
    display_name: "TSN"
    description: "Group of software components and ingredients to enable Intel's Time-Sensitive Networking (TSN) technology on Edge platforms."
    category: "Intel Technologies"
    included_in_base_profiles:
      - base-realtime
    base-profiles: # only available for these profile
      - base-standard
    supported_platforms:
      - "ptl"
      - "wcl"
    meta_packages: # additional package to install on top of base profiles
      - intel-edge-tsn
